[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-classifier-finetune"
version = "0.1.0"
description = "Fine-tune DistilBERT for intent classification (Banking77), evaluate it, and serve it with FastAPI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0,<2",
    "datasets>=5.1.0,<6",
    "fastapi>=0.162.0,<1",
    "matplotlib>=3.11.0,<4",
    "numpy>=2.5.0,<3",
    "pydantic>=2.14.0,<3",
    "scikit-learn>=1.9.0,<2",
    "structlog>=26.1.0,<27",
    "torch>=2.15.0,<3",
    "transformers>=5.21.0,<6",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
baseline = ["anthropic>=2.3.0,<3"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clf"]

# CPU-only PyTorch wheels: keeps CI and Docker images free of CUDA downloads.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# The ML stack is only partially typed; its objects are annotated Any at the boundary.
[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "datasets.*", "sklearn.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["clf.train", "clf.data", "clf.predict", "clf.metrics"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
